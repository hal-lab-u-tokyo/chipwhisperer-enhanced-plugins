[project]
name = "cw_plugins"
requires-python = ">=3.10,<3.14"
dynamic = ["version", "description", "authors", "license", "urls", "dependencies"]

[tool.setuptools.dynamic]
version = {attr = "cw_plugins.__version__"}

[build-system]
requires = ["setuptools>=64", "wheel", "pybind11>=2.10"]
build-backend = "setuptools.build_meta"
